<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">DUELTRACE</title>
<desc id="desc">Triângulo ciano, olho dourado e núcleo luminoso sobre fundo azul-escuro.</desc>
