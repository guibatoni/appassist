name: Validar integração v0 DUELTRACE Windows

on:
  push:
    branches:
      - main
      - feature/dueltrace-v070-v0-desktop-integration
      - security/dueltrace-v070-client-safety
      - fix/dueltrace-v070-tailwind-styles
      - feature/dueltrace-v071-rank-and-fusion-images
      - feature/dueltrace-v072-check-updates
      - feature/dueltrace-v073-iso-deep-assets-and-card-text
      - fix/dueltrace-v073-preview-update-button
      - security/dueltrace-trusted-distribution-v073
      - feature/dueltrace-v074-drops-ranks-frames
      - feature/dueltrace-v075-rank-forensics-safe-updater
      - feature/dueltrace-v076-rank-autodiscovery
      - feature/dueltrace-v077-mips-rank-safe-updates
      - feature/dueltrace-v078-rank-drops-filters-evidence
      - feature/dueltrace-v079-rank-proof-pipeline
      - feature/dueltrace-v080-classic-ranks-and-drop-pools
      - feature/dueltrace-v081-rank-label-by-iso
      - feature/dueltrace-v082-rank-duel-audit
      - feature/dueltrace-v083-updater-rank-capture
      - feature/dueltrace-v084-rank-diagnostic
      - feature/dueltrace-v085-preview-auto-update
      - 'feature/dueltrace-v*'
    paths:
      - 'web/**'
      - 'scanner/**'
      - 'tests/**'
      - 'tools/security/**'
      - '.github/workflows/validar-webui-desktop.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'scanner/**'
      - 'tests/**'
      - 'tools/security/**'
      - '.github/workflows/validar-webui-desktop.yml'

permissions:
  contents: read

jobs:
  build-web-and-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Pillow para testes de extração de arte PS1
        run: python -m pip install pillow==13.0.0 capstone==5.0.9
      - name: Executar toda a suíte Python (inclui extração WA/SLUS)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Instalar dependências Next.js
        working-directory: web
        run: npm ci
      - name: Auditar dependências de produção JavaScript (moderada ou superior)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - name: Auditar todas as dependências JavaScript (alta ou crítica)
        working-directory: web
        run: npm audit --audit-level=high
      - name: Verificar tipagem e build estático
        working-directory: web
        run: npm run build
      - name: Rejeitar CSS do Tailwind incompleto
        run: python tools/security/verify_web_css.py
      - name: Registrar SBOM das dependências web
        shell: pwsh
        working-directory: web
        run: |
          New-Item -ItemType Directory -Force -Path ../dist/security | Out-Null
          npm sbom --sbom-format cyclonedx | Out-File -FilePath ../dist/security/npm-sbom.cdx.json -Encoding utf8
      - name: Validar quatro páginas compiladas
        shell: pwsh
        run: |
          $needed = @('web/out/index.html', 'web/out/inicio/index.html', 'web/out/mods/index.html', 'web/out/biblioteca/index.html', 'web/out/fusoes/index.html', 'web/out/drops/index.html')
          foreach ($file in $needed) {
            if (-not (Test-Path $file)) { throw "Falta HTML da tela: $file" }
          }
      - name: Instalar dependências Windows fixadas e auditor de CVEs
        run: python -m pip install -r tools/security/requirements-webui-build.txt pip-audit
      - name: Auditar dependências Python instaladas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/security | Out-Null
          python -m pip list --format=json | Out-File dist/security/python-dependencies.json -Encoding utf8
          python -m pip_audit --local --format=json --output dist/security/python-audit.json
      - name: Registrar identidade verificável do build Preview
        shell: pwsh
        env:
          DUELTRACE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $identity = @{ schema = 1; run_id = [long]$env:GITHUB_RUN_ID; head_sha = $env:DUELTRACE_HEAD_SHA; version = "0.9.7" } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "scanner/dueltrace-build.json"), $identity, [System.Text.UTF8Encoding]::new($false))
      - name: Empacotar UI v0 com motor Python
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name DUELTRACE-WebUI --paths scanner --collect-all webview --add-data "web/out;web/out" --add-data "scanner/dueltrace-build.json;." scanner/dueltrace_web_desktop.py
          if (-not (Test-Path dist/DUELTRACE-WebUI/DUELTRACE-WebUI.exe)) { throw "Executável experimental ausente" }
          Copy-Item tools/security/AVISO-SEGURANCA-PREVIEW.txt dist/DUELTRACE-WebUI/LEIA-ME-SEGURANCA.txt
          Compress-Archive -Path dist/DUELTRACE-WebUI/* -DestinationPath dist/DUELTRACE-WebUI-Windows-Preview.zip -Force
      - name: Testar bloqueio de release pública sem editor autorizado
        shell: pwsh
        run: |
          $rejected=$false
          try {
            ./tools/security/gate_windows_package.ps1 -PackageDirectory dist/DUELTRACE-WebUI -ZipPath dist/DUELTRACE-WebUI-Windows-Preview.zip -OutputDirectory dist/security -RequireSignature -ExpectedPublisherSubject 'CN=EDITOR_INVALIDO'
          } catch {
            if ($_.Exception.Message -like 'Release pública bloqueada*') {
              $rejected=$true
            } else {
              throw
            }
          }
          if (-not $rejected) { throw 'ERRO: gate aceitou release sem editor autorizado.' }
          Write-Host 'Gate de publicação pública rejeitou editor inválido, conforme esperado.'
      - name: Confirmar integridade exata do ZIP e ausência de recursos privados
        shell: pwsh
        run: |
          python tools/security/audit_windows_archive.py dist/DUELTRACE-WebUI dist/DUELTRACE-WebUI-Windows-Preview.zip --report dist/security/archive-integrity.json
      - name: Escanear pacote com Microsoft Defender e gerar SHA-256
        shell: pwsh
        run: |
          ./tools/security/gate_windows_package.ps1 -PackageDirectory dist/DUELTRACE-WebUI -ZipPath dist/DUELTRACE-WebUI-Windows-Preview.zip -OutputDirectory dist/security
      - uses: actions/upload-artifact@v4
        with:
          name: DUELTRACE-Windows-Preview-Unsigned-Security-Scanned
          path: |
            dist/DUELTRACE-WebUI-Windows-Preview.zip
            dist/security/
          if-no-files-found: error
          retention-days: 14

  publish-preview-release:
    name: Publicar Preview verificável no GitHub Releases
    needs: build-web-and-windows
    if: github.event_name == 'push' && github.repository == 'guibatoni/appassist' && startsWith(github.ref, 'refs/heads/feature/dueltrace-v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DUELTRACE-Windows-Preview-Unsigned-Security-Scanned
          path: preview
      - name: Publicar pacote após CI, auditoria e Defender
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Mesma versão canônica do checker; a publicação segue restrita a feature/.
          export LC_ALL=C
          semver_component='(0|[1-9][0-9]{0,3})'
          semver_branch="^feature/dueltrace-v(${semver_component}[.]${semver_component}[.]${semver_component})-[a-z0-9][a-z0-9-]*$"
          if [[ "$GITHUB_REF_NAME" =~ ^feature/dueltrace-v([0-9])([0-9])([0-9])-[a-z0-9][a-z0-9-]*$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          elif [[ "$GITHUB_REF_NAME" =~ $semver_branch ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Branch não corresponde a uma versão Preview"
            exit 1
          fi
          file="preview/DUELTRACE-WebUI-Windows-Preview.zip"
          test -f "$file"
          test "$(stat -c%s "$file")" -gt 1000000
          sha256sum "$file"
          tag="preview-v${version}-r${GITHUB_RUN_ID}"
          expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
          expected_size="$(stat -c%s "$file")"
          asset_name="DUELTRACE-WebUI-Windows-Preview.zip"
          # GitHub pode registrar ZIP e manter draft se a API falhar durante
          # publicação. Em retry, conferir COMMIT, tamanho e hash do ativo antes
          # de liberar a release, sem reenviar um pacote diferente.
          recover_existing_release() {
            local metadata="" attempt=""
            for attempt in 1 2 3; do
              if metadata="$(gh api "repos/${GH_REPO}/releases/tags/${tag}")"; then break; fi
              sleep 2
            done
            test -n "$metadata" || { echo "Release não consultável: sem publicação."; return 1; }
            local actual_sha count actual_digest actual_size
            actual_sha="$(jq -r '.target_commitish // ""' <<<"$metadata")"
            count="$(jq --arg name "$asset_name" '[.assets[] | select(.name == $name)] | length' <<<"$metadata")"
            actual_digest="$(jq -r --arg name "$asset_name" '[.assets[] | select(.name == $name)][0].digest // ""' <<<"$metadata")"
            actual_size="$(jq -r --arg name "$asset_name" '[.assets[] | select(.name == $name)][0].size // 0' <<<"$metadata")"
            if [[ "$actual_sha" != "$GITHUB_SHA" || "$count" != "1" ||
                  "$actual_digest" != "$expected" || "$actual_size" != "$expected_size" ]]; then
              echo "Rascunho não corresponde ao build validado: publicação bloqueada."
              return 1
            fi
            if jq -e '.draft == true' <<<"$metadata" >/dev/null; then
              gh release edit "$tag" --draft=false --prerelease --latest=false
            fi
          }
          if gh api "repos/${GH_REPO}/releases/tags/${tag}" >/dev/null 2>&1; then
            recover_existing_release
          elif ! gh release create "$tag" "$file" \
            --title "DUELTRACE Preview v${version} · build #${GITHUB_RUN_ID}" \
            --notes "Prévia experimental Windows sem assinatura digital. Build ${GITHUB_SHA}, Actions #${GITHUB_RUN_ID}. Artefato aprovado pela CI, auditoria SHA-256 e Microsoft Defender. Não contém ISOs, saves ou ROMs. Para atualizações dentro do app, compare o hash publicado e aceite conscientemente o pacote de testes." \
            --target "$GITHUB_SHA" --prerelease --latest=false; then
            recover_existing_release
          fi
