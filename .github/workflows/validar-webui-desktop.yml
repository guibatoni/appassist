name: Validar integração v0 DUELTRACE Windows

on:
  push:
    branches:
      - main
      - feature/dueltrace-v070-v0-desktop-integration
      - security/dueltrace-v070-client-safety
      - fix/dueltrace-v070-tailwind-styles
      - feature/dueltrace-v071-rank-and-fusion-images
      - feature/dueltrace-v072-check-updates
      - feature/dueltrace-v073-iso-deep-assets-and-card-text
      - fix/dueltrace-v073-preview-update-button
      - security/dueltrace-trusted-distribution-v073
      - feature/dueltrace-v074-drops-ranks-frames
      - feature/dueltrace-v075-rank-forensics-safe-updater
      - feature/dueltrace-v076-rank-autodiscovery
      - feature/dueltrace-v077-mips-rank-safe-updates
      - feature/dueltrace-v078-rank-drops-filters-evidence
      - feature/dueltrace-v079-rank-proof-pipeline
      - feature/dueltrace-v080-classic-ranks-and-drop-pools
      - feature/dueltrace-v081-rank-label-by-iso
      - feature/dueltrace-v082-rank-duel-audit
      - feature/dueltrace-v083-updater-rank-capture
      - feature/dueltrace-v084-rank-diagnostic
      - feature/dueltrace-v085-preview-auto-update
      - 'feature/dueltrace-v*'
    paths:
      - 'web/**'
      - 'scanner/**'
      - 'tests/**'
      - 'tools/security/**'
      - 'tools/licensing/**'
      - 'installer/**'
      - '.github/workflows/validar-webui-desktop.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'scanner/**'
      - 'tests/**'
      - 'tools/security/**'
      - 'tools/licensing/**'
      - 'installer/**'
      - '.github/workflows/validar-webui-desktop.yml'

permissions:
  contents: read

jobs:
  build-web-and-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # private Preview fallback on trusted feature branch pushes only
    outputs:
      artifact_ready: ${{ steps.preview_artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Pillow para testes de extração de arte PS1
        run: python -m pip install pillow==13.0.0 capstone==5.0.9 cryptography==50.0.2
      - name: Executar toda a suíte Python (inclui extração WA/SLUS)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Instalar dependências Next.js
        working-directory: web
        run: npm ci
      - name: Auditar dependências de produção JavaScript (moderada ou superior)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - name: Auditar todas as dependências JavaScript (alta ou crítica)
        working-directory: web
        run: npm audit --audit-level=high
      - name: Verificar tipagem e build estático
        working-directory: web
        run: npm run build
      - name: Rejeitar CSS do Tailwind incompleto
        run: python tools/security/verify_web_css.py
      - name: Registrar SBOM das dependências web
        shell: pwsh
        working-directory: web
        run: |
          New-Item -ItemType Directory -Force -Path ../dist/security | Out-Null
          npm sbom --sbom-format cyclonedx | Out-File -FilePath ../dist/security/npm-sbom.cdx.json -Encoding utf8
      - name: Validar páginas principais e pop-ups compilados
        shell: pwsh
        run: |
          $needed = @('web/out/index.html', 'web/out/inicio/index.html', 'web/out/mods/index.html', 'web/out/biblioteca/index.html', 'web/out/fusoes/index.html', 'web/out/drops/index.html', 'web/out/ferramentas/calculadora/index.html', 'web/out/ferramentas/fusoes/index.html')
          foreach ($file in $needed) {
            if (-not (Test-Path $file)) { throw "Falta HTML da tela: $file" }
          }
      - name: Instalar dependências Windows fixadas e auditor de CVEs
        run: python -m pip install -r tools/security/requirements-webui-build.txt pip-audit
      - name: Auditar dependências Python instaladas
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/security | Out-Null
          python -m pip list --format=json | Out-File dist/security/python-dependencies.json -Encoding utf8
          python -m pip_audit --local --format=json --output dist/security/python-audit.json
      - name: Registrar identidade verificável do build Preview
        shell: pwsh
        env:
          DUELTRACE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $identity = @{ schema = 1; run_id = [long]$env:GITHUB_RUN_ID; head_sha = $env:DUELTRACE_HEAD_SHA; version = "0.9.7" } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "scanner/dueltrace-build.json"), $identity, [System.Text.UTF8Encoding]::new($false))
      - name: Empacotar UI v0 com motor Python
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name DUELTRACE-WebUI --paths scanner --collect-all webview --add-data "web/out;web/out" --add-data "scanner/dueltrace-build.json;." scanner/dueltrace_web_desktop.py
          if (-not (Test-Path dist/DUELTRACE-WebUI/DUELTRACE-WebUI.exe)) { throw "Executável experimental ausente" }
          Copy-Item tools/security/AVISO-SEGURANCA-PREVIEW.txt dist/DUELTRACE-WebUI/LEIA-ME-SEGURANCA.txt
          Compress-Archive -Path dist/DUELTRACE-WebUI/* -DestinationPath dist/DUELTRACE-WebUI-Windows-Preview.zip -Force
      - name: Empacotar executável Commercial Lite de teste isolado (somente PR)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'commercial/') }}
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name DUELTRACE-Commercial --paths scanner --collect-all webview --add-data "web/out;web/out" --add-data "scanner/dueltrace-build.json;." scanner/dueltrace_commercial_entry.py
          if ($LASTEXITCODE -ne 0) { throw "Build comercial não compilou." }
          if (-not (Test-Path 'dist/DUELTRACE-Commercial/DUELTRACE-Commercial.exe')) {
            throw "Executável Commercial Lite ausente."
          }
          # A edição de teste permanece travada: sem chave pública definitiva.
          $public = Get-Content 'scanner/dueltrace_commercial_public_key.py' -Raw
          if ($public -notmatch 'PUBLIC_KEY_B64 = ""') {
            throw "Este workflow só pode produzir protótipo SEM chave pública comercial."
          }
      - name: Compilar instalador NSIS experimental (somente PR commercial)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'commercial/') }}
        shell: pwsh
        run: |
          # O instalador de teste NÃO é distribuído nem incluído nas Releases.
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível instalar NSIS no runner." }
          $compilers = @('C:\Program Files (x86)\NSIS\makensis.exe', 'C:\Program Files\NSIS\makensis.exe')
          $compiler = $compilers | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "Compilador NSIS não encontrado." }
          $package = (Resolve-Path 'dist/DUELTRACE-Commercial').Path
          & $compiler "/DBUILD_DIR=$package" 'installer/dueltrace-commercial-lite.nsi'
          if ($LASTEXITCODE -ne 0) { throw "Instalador NSIS de teste não compilou." }
          $setup = (Resolve-Path 'installer/DUELTRACE-Setup-TESTE.exe').Path
          if ((Get-Item $setup).Length -lt 1000000) { throw "Instalador de teste incompleto." }
          Start-MpScan -ScanType CustomScan -ScanPath $setup -ErrorAction Stop
          $install = Join-Path $env:LOCALAPPDATA 'Programs/DUELTRACE-Commercial'
          $preserved = Join-Path $env:LOCALAPPDATA 'ForbiddenMemoriesMultiMod/commercial/ci-preserve-test.txt'
          New-Item -ItemType Directory -Path (Split-Path $preserved) -Force | Out-Null
          Set-Content -LiteralPath $preserved -Value 'preservar' -Encoding utf8
          try {
            # Teste de instalação silenciosa, repetição e remoção sem apagar AppData.
            $first = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
            if ($first.ExitCode -ne 0) { throw "Primeira instalação NSIS falhou." }
            $exe = Join-Path $install 'DUELTRACE-Commercial.exe'
            if (-not (Test-Path -LiteralPath $exe)) { throw "EXE comercial não instalado." }
            $second = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
            if ($second.ExitCode -ne 0) { throw "Reinstalação no mesmo local falhou." }
            $uninstaller = Join-Path $install 'Desinstalar DUELTRACE.exe'
            $un = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($un.ExitCode -ne 0) { throw "Desinstalação NSIS falhou." }
            if (Test-Path -LiteralPath $exe) { throw "EXE permaneceu após desinstalação." }
            if (-not (Test-Path -LiteralPath $preserved)) { throw "Desinstalador apagou dados pessoais!" }
          } finally {
            if (Test-Path -LiteralPath $preserved) {
              Remove-Item -LiteralPath $preserved -Force
            }
            if (Test-Path -LiteralPath $setup) { Remove-Item -LiteralPath $setup -Force }
          }

      - name: Testar bloqueio de release pública sem editor autorizado
        shell: pwsh
        run: |
          $rejected=$false
          try {
            ./tools/security/gate_windows_package.ps1 -PackageDirectory dist/DUELTRACE-WebUI -ZipPath dist/DUELTRACE-WebUI-Windows-Preview.zip -OutputDirectory dist/security -RequireSignature -ExpectedPublisherSubject 'CN=EDITOR_INVALIDO'
          } catch {
            if ($_.Exception.Message -like 'Release pública bloqueada*') {
              $rejected=$true
            } else {
              throw
            }
          }
          if (-not $rejected) { throw 'ERRO: gate aceitou release sem editor autorizado.' }
          Write-Host 'Gate de publicação pública rejeitou editor inválido, conforme esperado.'
      - name: Confirmar integridade exata do ZIP e ausência de recursos privados
        shell: pwsh
        run: |
          python tools/security/audit_windows_archive.py dist/DUELTRACE-WebUI dist/DUELTRACE-WebUI-Windows-Preview.zip --report dist/security/archive-integrity.json
      - name: Escanear pacote com Microsoft Defender e gerar SHA-256
        shell: pwsh
        run: |
          ./tools/security/gate_windows_package.ps1 -PackageDirectory dist/DUELTRACE-WebUI -ZipPath dist/DUELTRACE-WebUI-Windows-Preview.zip -OutputDirectory dist/security
      - uses: actions/upload-artifact@v4
        id: preview_artifact
        continue-on-error: true  # GitHub Actions artifact storage quota fallback
        with:
          name: DUELTRACE-Windows-Preview-Unsigned-Security-Scanned
          path: |
            dist/DUELTRACE-WebUI-Windows-Preview.zip
            dist/security/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar Preview privada diretamente se a cota Artifacts estiver cheia
        if: ${{ github.event_name == 'push' && github.repository == 'guibatoni/appassist' && startsWith(github.ref, 'refs/heads/feature/dueltrace-v') && steps.preview_artifact.outcome == 'failure' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run only after Python/Next.js tests, archive audit and Defender passed.
          # This is a private repository, not a public release.
          $branch = $env:GITHUB_REF_NAME
          $found = [regex]::Match($branch, '^feature/dueltrace-v([0-9])([0-9])([0-9])-[a-z0-9][a-z0-9-]*$')
          if (-not $found.Success) { throw "Branch Preview inválida." }
          $version = "$($found.Groups[1].Value).$($found.Groups[2].Value).$($found.Groups[3].Value)"
          $zip = (Resolve-Path 'dist/DUELTRACE-WebUI-Windows-Preview.zip').Path
          $size = (Get-Item $zip).Length
          if ($size -lt 1000000) { throw "ZIP Preview incompleto." }
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $tag = "preview-v$version-r$env:GITHUB_RUN_ID"
          $notesFile = Join-Path $env:RUNNER_TEMP 'dueltrace-update-notes.md'
          $notes = (Get-Content -LiteralPath 'docs/DUELTRACE_UPDATE_NOTES.md' -Raw -Encoding utf8).Trim()
          $notes += "`n`n---`nBuild $env:GITHUB_RUN_ID | Commit $env:GITHUB_SHA | SHA-256 ZIP: $hash"
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DUELTRACE Preview v$version build $env:GITHUB_RUN_ID" --notes-file $notesFile --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Falha ao criar Release privada." }
          $metadata = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $metadata) { throw "Release não consultável." }
          $asset = @($metadata.assets | Where-Object { $_.name -eq 'DUELTRACE-WebUI-Windows-Preview.zip' })
          if ($metadata.target_commitish -ne $env:GITHUB_SHA -or $asset.Count -ne 1) {
            throw "Release não corresponde ao commit validado."
          }
          if ($asset[0].size -ne $size -or $asset[0].digest -ne "sha256:$hash") {
            throw "Release não corresponde ao tamanho/hash auditado."
          }
          Write-Host "Preview privada publicada: $tag"

  publish-preview-release:
    name: Publicar Preview verificável no GitHub Releases
    needs: build-web-and-windows
    if: github.event_name == 'push' && github.repository == 'guibatoni/appassist' && startsWith(github.ref, 'refs/heads/feature/dueltrace-v') && needs.build-web-and-windows.outputs.artifact_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DUELTRACE-Windows-Preview-Unsigned-Security-Scanned
          path: preview
      - name: Publicar pacote após CI, auditoria e Defender
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Mesma versão canônica do checker; a publicação segue restrita a feature/.
          export LC_ALL=C
          semver_component='(0|[1-9][0-9]{0,3})'
          semver_branch="^feature/dueltrace-v(${semver_component}[.]${semver_component}[.]${semver_component})-[a-z0-9][a-z0-9-]*$"
          if [[ "$GITHUB_REF_NAME" =~ ^feature/dueltrace-v([0-9])([0-9])([0-9])-[a-z0-9][a-z0-9-]*$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          elif [[ "$GITHUB_REF_NAME" =~ $semver_branch ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Branch não corresponde a uma versão Preview"
            exit 1
          fi
          file="preview/DUELTRACE-WebUI-Windows-Preview.zip"
          test -f "$file"
          test "$(stat -c%s "$file")" -gt 1000000
          sha256sum "$file"
          tag="preview-v${version}-r${GITHUB_RUN_ID}"
          expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
          expected_size="$(stat -c%s "$file")"
          asset_name="DUELTRACE-WebUI-Windows-Preview.zip"
          # GitHub pode registrar ZIP e manter draft se a API falhar durante
          # publicação. Em retry, conferir COMMIT, tamanho e hash do ativo antes
          # de liberar a release, sem reenviar um pacote diferente.
          recover_existing_release() {
            local metadata="" attempt=""
            for attempt in 1 2 3; do
              if metadata="$(gh api "repos/${GH_REPO}/releases/tags/${tag}")"; then break; fi
              sleep 2
            done
            test -n "$metadata" || { echo "Release não consultável: sem publicação."; return 1; }
            local actual_sha count actual_digest actual_size
            actual_sha="$(jq -r '.target_commitish // ""' <<<"$metadata")"
            count="$(jq --arg name "$asset_name" '[.assets[] | select(.name == $name)] | length' <<<"$metadata")"
            actual_digest="$(jq -r --arg name "$asset_name" '[.assets[] | select(.name == $name)][0].digest // ""' <<<"$metadata")"
            actual_size="$(jq -r --arg name "$asset_name" '[.assets[] | select(.name == $name)][0].size // 0' <<<"$metadata")"
            if [[ "$actual_sha" != "$GITHUB_SHA" || "$count" != "1" ||
                  "$actual_digest" != "$expected" || "$actual_size" != "$expected_size" ]]; then
              echo "Rascunho não corresponde ao build validado: publicação bloqueada."
              return 1
            fi
            if jq -e '.draft == true' <<<"$metadata" >/dev/null; then
              gh release edit "$tag" --draft=false --prerelease --latest=false
            fi
          }
          notes_file="$RUNNER_TEMP/dueltrace-update-notes.md"
          cp docs/DUELTRACE_UPDATE_NOTES.md "$notes_file"
          printf '\n---\nBuild %s | Commit %s | SHA-256 ZIP: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${expected#sha256:}" >> "$notes_file"
          if gh api "repos/${GH_REPO}/releases/tags/${tag}" >/dev/null 2>&1; then
            recover_existing_release
          elif ! gh release create "$tag" "$file" \
            --title "DUELTRACE Preview v${version} · build #${GITHUB_RUN_ID}" \
            --notes-file "$notes_file" \
            --target "$GITHUB_SHA" --prerelease --latest=false; then
            recover_existing_release
          fi
