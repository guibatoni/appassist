name: Validar Scanner e Perfis MultiMod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes-scanner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar sintaxe do scanner e testes
        run: python -m compileall -q scanner tests
      - name: Executar testes locais sem ROMs
        run: python -m unittest discover -s tests -v
