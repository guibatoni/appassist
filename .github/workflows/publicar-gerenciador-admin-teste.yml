name: Publicar Gerenciador Batoni Dev TESTE (repositório privado)

on:
  push:
    branches:
      - commercial/dueltrace-license-manager-redesign-v42
    paths:
      - 'tools/licensing/**'
      - 'tests/test_dueltrace_license_admin*.py'
      - '.github/workflows/publicar-gerenciador-admin-teste.yml'

permissions:
  contents: read

jobs:
  private-owner-release:
    if: github.repository == 'guibatoni/appassist'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirmar repositório privado e branch exclusiva de testes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_NAME -ne 'commercial/dueltrace-license-manager-redesign-v42') {
            throw "Publicação autorizada apenas na branch privada de teste."
          }
          $repo = gh api "repos/$env:GITHUB_REPOSITORY" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $repo.private) {
            throw "Gerenciador do proprietário só pode ser publicado em repositório PRIVADO."
          }
          $tracked = @(git ls-files -- '*.pem' '*.p12' '*.pfx' '*.key')
          if ($tracked.Count -gt 0) {
            throw "Arquivo de chave privada rastreado no repositório. Publicação bloqueada."
          }
          $public = Get-Content 'scanner/dueltrace_commercial_public_key.py' -Raw
          if ($public -notmatch 'PUBLIC_KEY_B64 = ""') {
            throw "Build TESTE não aceita chave pública de produção configurada."
          }

      - name: Instalar dependências fixadas
        run: python -m pip install cryptography==50.0.2 pyinstaller==6.22.3 customtkinter==6.0.0 pip-audit

      - name: Testar emissor e auditar dependências
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_dueltrace_license_admin*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Falha nos testes de licenciamento." }
          python tools/licensing/smoke_admin_ui.py
          if ($LASTEXITCODE -ne 0) { throw "Falha no teste visual Windows." }
          python -m pip_audit --local
          if ($LASTEXITCODE -ne 0) { throw "Dependências vulneráveis." }

      - name: Compilar Gerenciador sem chave privada
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name BatoniDev-LicenseManager --collect-all customtkinter --paths scanner --paths tools/licensing tools/licensing/dueltrace_license_admin.py
          if ($LASTEXITCODE -ne 0) { throw "Compilação Windows falhou." }
          $exe = 'dist/BatoniDev-LicenseManager/BatoniDev-LicenseManager.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Gerenciador ausente." }

      - name: Rejeitar segredos, testar integridade e analisar com Defender
        shell: pwsh
        run: |
          $folder = (Resolve-Path 'dist/BatoniDev-LicenseManager').Path
          $forbidden = @(Get-ChildItem -LiteralPath $folder -Recurse -File |
            Where-Object { $_.Name -match '(?i)(^issuer_ed25519_private|license\.json$|\.pem$|\.p12$|\.pfx$|\.key$)' })
          if ($forbidden.Count -gt 0) { throw "Pacote contém arquivos privados." }
          $zip = 'dist/BatoniDev-LicenseManager-Windows-TESTE.zip'
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath $zip -Force
          if ((Get-Item $zip).Length -lt 1000000) { throw "Pacote incompleto." }
          $status = Get-MpComputerStatus -ErrorAction Stop
          if ($status.AntivirusEnabled -ne $true -or $status.AMServiceEnabled -ne $true) {
            throw "Defender inativo: publicação bloqueada."
          }
          if ($null -eq $status.AntivirusSignatureAge -or $status.AntivirusSignatureAge -gt 7) {
            throw "Defender desatualizado: publicação bloqueada."
          }
          $scanStarted = Get-Date
          Start-MpScan -ScanPath (Join-Path $folder 'BatoniDev-LicenseManager.exe') -ScanType CustomScan -ErrorAction Stop
          Start-MpScan -ScanPath (Resolve-Path $zip).Path -ScanType CustomScan -ErrorAction Stop
          $detections = @(Get-MpThreatDetection -ErrorAction Stop |
            Where-Object { $_.InitialDetectionTime -ge $scanStarted })
          if ($detections.Count -ne 0) { throw "Defender identificou ameaça." }
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA-256 pacote administrador: $hash" | Write-Host

      - name: Publicar ZIP TESTE no GitHub Releases privado (sem Artifacts)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = gh api "repos/$env:GITHUB_REPOSITORY" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $repo.private) {
            throw "Repositório não privado: publicação negada."
          }
          $zip = (Resolve-Path 'dist/BatoniDev-LicenseManager-Windows-TESTE.zip').Path
          $tag = "admin-test-v42-r$env:GITHUB_RUN_ID"
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $zip).Length
          $notes = @"
          BATONI DEV LICENSE MANAGER — TESTE PRIVADO, APENAS PARA O PROPRIETÁRIO.
          Não contém chaves privadas, clientes, dados pessoais ou emissão real no CI.
          Não é aplicativo comercial final nem deve ser enviado aos compradores.
          Não desative Microsoft Defender ou SmartScreen para usá-lo.
          Build: $env:GITHUB_SHA
          SHA-256 ZIP: $hash
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'admin-release-notes.txt'
          [System.IO.File]::WriteAllText($notesFile, $notes, [System.Text.UTF8Encoding]::new($false))
          gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Batoni Dev License Manager REDESIGN TESTE — build $env:GITHUB_RUN_ID" --notes-file $notesFile --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar no repositório privado." }
          $metadata = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $metadata.target_commitish -ne $env:GITHUB_SHA) {
            throw "Release não corresponde ao commit auditado."
          }
          $assets = @($metadata.assets | Where-Object { $_.name -eq 'BatoniDev-LicenseManager-Windows-TESTE.zip' })
          if ($assets.Count -ne 1 -or $assets[0].size -ne $size -or $assets[0].digest -ne "sha256:$hash") {
            throw "Release não corresponde à integridade auditada."
          }
          Write-Host "ZIP administrador TESTE publicado privadamente: $tag"
