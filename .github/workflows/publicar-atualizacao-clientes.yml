name: Publicar atualizacao DUELTRACE para clientes

on:
  workflow_dispatch:
    inputs:
      private_preview_tag:
        description: Preview privada aprovada para distribuir (tag completa)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dueltrace-public-customer-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validar, assinar e distribuir binario (sem fonte)
    runs-on: windows-latest
    environment: customer-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar CI privado, assinar EXE, Microsoft Defender e publicar
        shell: pwsh
        env:
          PRIVATE_GH_TOKEN: ${{ github.token }}
          PUBLIC_GH_TOKEN: ${{ secrets.DUELTRACE_PUBLIC_RELEASE_TOKEN }}
          PFX_BASE64: ${{ secrets.DUELTRACE_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.DUELTRACE_CODESIGN_PFX_PASSWORD }}
          EXPECTED_PUBLISHER: ${{ vars.DUELTRACE_EXPECTED_PUBLISHER_SUBJECT }}
          INPUT_PRIVATE_TAG: ${{ inputs.private_preview_tag }}
        run: |
          ./tools/release/publicar_cliente.ps1 -PrivateTag $env:INPUT_PRIVATE_TAG
